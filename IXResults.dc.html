<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="ix-data.js"></script></helmet>
<section data-screen-label="Results" style="max-width:1360px;margin:0 auto;padding:clamp(64px,9vw,120px) clamp(20px,3.4vw,48px) 0">
  <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:32px">
    <div style="display:flex;flex-direction:column;gap:14px"><span style="font-family:'Geist Mono',monospace;font-size:12px;color:#5C5F64">{{ kicker }}</span><h2 style="margin:0;font-size:clamp(34px,4.8vw,68px);line-height:1;font-weight:500;letter-spacing:-.055em">Growth you<br><span style="color:#757575">can measure.</span></h2></div>
    <a href="Blog.dc.html?c=case-studies" style="display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:12px;background:#00B9FE;color:#02061E;font-size:14px;font-weight:500" style-hover="background:#DBF5FF;color:#0175A9">All case studies →</a>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:12px">
    <sc-for list="{{ results }}" as="r" hint-placeholder-count="3">
      <div style="flex:1 1 190px;min-width:0;min-height:clamp(240px,26vw,310px);display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:24px;border-radius:22px;background:{{ r.bg }};color:{{ r.fg }};transition:transform .35s ease-out" style-hover="transform:translateY(-4px)">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><span style="font-family:'Geist Mono',monospace;font-size:12px;white-space:nowrap;color:{{ r.mute }}">// {{ r.ind }}</span><span style="padding:6px 12px;border-radius:999px;background:{{ r.chip }};font-size:13px;font-weight:500">{{ r.client }}</span></div>
        <div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:clamp(48px,4.6vw,72px);line-height:1;font-weight:500;letter-spacing:-.06em;color:{{ r.num }}">{{ r.metric }}</span><span style="font-size:15px;font-weight:500">{{ r.label }}</span><span style="font-size:13px;line-height:1.5;color:{{ r.mute }}">{{ r.desc }}</span></div>
      </div>
    </sc-for>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;kicker&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;// Case studies&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;clients&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;APIIT,Pay&amp;Go,DSI Tyres&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { ix: 0 };
  componentDidMount() { const t = () => { if (window.IX) this.setState({ ix: 1 }); else this.tm = setTimeout(t, 30); }; t(); }
  componentWillUnmount() { clearTimeout(this.tm); }
  renderVals() {
    const D = window.IX;
    const kicker = this.props.kicker ?? '// Case studies';
    if (!D) return { kicker };
    const want = String(this.props.clients ?? 'APIIT,Pay&Go,DSI Tyres').split(',').map((s) => s.trim()).filter(Boolean);
    const list = want.map((c) => D.results.find((r) => r.client === c)).filter(Boolean);
    return { kicker, results: list.map((r) => D.card(r)) };
  }
}
</script>
</body>
</html>
