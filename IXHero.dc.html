<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>@keyframes ixLine{from{transform:translateY(105%)}to{transform:none}}@keyframes ixRise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}@keyframes ixMarq{from{transform:translateX(0)}to{transform:translateX(-50%)}}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style>
</helmet>
<section data-ix="ph-wrap" data-screen-label="Hero banner" style="position:relative;overflow:hidden;min-height:max(680px,92vh);margin-bottom:clamp(48px,7vw,96px);background:linear-gradient(180deg,#EEF0F3 0%,#EEF0F3 36%,#DBF5FF 54%,#0175A9 72%,#022D4F 86%,#02061E 100%);border-radius:0 0 32px 32px">
  <div style="position:absolute;left:50%;top:64%;width:1100px;height:520px;margin-left:-550px;border-radius:50%;background:radial-gradient(ellipse,rgba(128,220,254,.7) 0%,rgba(0,185,254,.22) 38%,rgba(0,185,254,0) 70%);pointer-events:none"></div>
  <canvas data-ix="ph" style="position:absolute;inset:0;width:100%;height:100%;display:block"></canvas>
  <div style="position:relative;max-width:1360px;margin:0 auto;min-height:max(680px,92vh);padding:clamp(112px,15vh,160px) clamp(20px,3.4vw,48px) 28px;display:flex;flex-direction:column;justify-content:space-between;gap:40px;pointer-events:none">
    <div style="display:flex;flex-direction:column;gap:clamp(20px,2.6vw,32px)">
      <span style="font-family:'Geist Mono',monospace;font-size:12px;color:#5C5F64;animation:ixRise .8s cubic-bezier(.2,.8,.2,1) .1s both">{{ kicker }}</span>
      <h1 style="margin:0;max-width:1180px;font-size:clamp(40px,6.4vw,100px);line-height:.96;font-weight:500;letter-spacing:-.058em">
        <span style="display:block;overflow:hidden;padding-bottom:.06em"><span style="display:block;color:#757575;animation:ixLine 1.1s cubic-bezier(.2,.8,.2,1) .2s both">{{ line1 }}</span></span>
        <span style="display:block;overflow:hidden;padding-bottom:.06em"><span style="display:block;color:#121418;animation:ixLine 1.1s cubic-bezier(.2,.8,.2,1) .32s both">{{ line2 }}</span></span>
      </h1>
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px 40px">
        <p style="margin:0;max-width:480px;font-size:16px;line-height:1.6;color:#43464B;animation:ixRise .9s cubic-bezier(.2,.8,.2,1) .5s both">{{ intro }}</p>
        <div style="display:flex;flex-wrap:wrap;gap:10px;pointer-events:auto;animation:ixRise .9s cubic-bezier(.2,.8,.2,1) .62s both">
          <a href="{{ ctaHref }}" style="display:inline-flex;align-items:center;gap:14px;min-height:52px;padding:5px 24px 5px 5px;border-radius:14px;background:#0175A9;color:#FFFFFF;font-size:15px;font-weight:500;white-space:nowrap;transition:background .25s" style-hover="background:#01517C;color:#FFFFFF"><span style="width:42px;height:42px;border-radius:10px;background:#00B9FE;color:#02061E;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 17 5-5-5-5"></path><path d="m13 17 5-5-5-5"></path></svg></span>{{ ctaLabel }}</a>
          <sc-if value="{{ hasCta2 }}"><a href="{{ cta2Href }}" style="display:inline-flex;align-items:center;min-height:52px;padding:0 22px;border-radius:14px;background:rgba(255,255,255,.72);color:#121418;font-size:15px;font-weight:500;white-space:nowrap" style-hover="background:#00B9FE;color:#02061E">{{ cta2 }}</a></sc-if>
        </div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px;animation:ixRise 1s cubic-bezier(.2,.8,.2,1) .9s both">
      <sc-if value="{{ hasFacts }}">
        <div style="display:flex;flex-wrap:wrap;gap:10px">
          <sc-for list="{{ facts }}" as="f" hint-placeholder-count="3"><div style="flex:1 1 180px;display:flex;align-items:baseline;gap:12px;padding:14px 18px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#FFFFFF;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)"><span style="font-size:clamp(26px,2.6vw,34px);line-height:1;font-weight:500;letter-spacing:-.05em;color:#80DCFE">{{ f.v }}</span><span style="font-size:13px;line-height:1.4;color:rgba(255,255,255,.85)">{{ f.l }}</span></div></sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ showLogos }}">
        <div aria-label="Clients" style="pointer-events:auto;overflow:hidden;border-radius:18px;background:#FFFFFF;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)">
          <div style="display:flex;width:max-content;animation:ixMarq 55s linear infinite">
            <sc-for list="{{ logos }}" as="l" hint-placeholder-count="19"><div style="flex:none;height:68px;padding:0 24px;display:flex;align-items:center"><img src="{{ l.src }}" alt="{{ l.alt }}" aria-hidden="{{ l.hide }}" style="height:{{ l.h }}px;width:auto;max-width:140px;object-fit:contain;display:block;filter:{{ l.f }};mix-blend-mode:multiply;opacity:.8"></div></sc-for>
          </div>
        </div>
      </sc-if>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;kicker&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;// Services&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;line1&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Five services,&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;line2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;one growth team.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;intro&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Book a call&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ctaHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Contact.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cta2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cta2Href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;shape&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;butterfly&quot;,&quot;rings&quot;,&quot;sphere&quot;,&quot;wave&quot;,&quot;grid&quot;,&quot;helix&quot;,&quot;orbit&quot;],&quot;default&quot;:&quot;butterfly&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;logos&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;f1v&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;f1l&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;f2v&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;f2l&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;f3v&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;f3l&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const LOGOS = [
  ['Dialog.svg', 'Dialog', 30], ['CommercialBank.svg', 'Commercial Bank', 30], ['SriLankanAirlines.png', 'SriLankan Airlines', 24], ['NDBBank.svg', 'NDB Bank', 28],
  ['DSITyres.png', 'DSI Tyres', 22], ['DSISamsonGroup.png', 'DSI Samson Group', 30], ['APIIT.svg', 'APIIT', 32], ['ElephantHouse.png', 'Elephant House', 40],
  ['CargillsBank.png', 'Cargills Bank', 26], ['MercantileInvestments.png', 'Mercantile Investments', 26], ['CeylonDollarBondFund.png', 'Ceylon Dollar Bond Fund', 34], ['CeylineGroup.png', 'Ceyline Group', 30],
  ['TangerineGroup.png', 'Tangerine Group', 30], ['RoyalPalmsBeachHotel.png', 'Royal Palms Beach Hotel', 30], ['NilaveliBeachHotel.png', 'Nilaveli Beach Hotel', 24], ['RiverFaceHotel.png', 'River Face Hotel', 38],
  ['MalikaHemachandra.png', 'Malika Hemachandra', 28], ['JAT.webp', 'JAT', 28, 1], ['Santani.svg', 'Santani', 30, 1]
];
const TAU = Math.PI * 2;
const SHAPES = {
  butterfly: (p, t) => { const f = 0.8 + 0.2 * Math.cos(t * 1.7); const a = p.u * Math.PI * 12; const r = Math.exp(Math.cos(a)) - 2 * Math.cos(4 * a) - Math.pow(Math.sin(a / 12), 5); const k = p.k; return [Math.sin(a) * r * k * f, -(Math.cos(a) * r * k - 1.1)]; },
  rings: (p, t) => { const ring = Math.floor(p.v * 5); const r = 0.6 + ring * 0.55; const a = p.u * TAU + t * 0.25 * (ring % 2 ? 1 : -1); return [Math.cos(a) * r * 1.1, Math.sin(a) * r * 0.42]; },
  sphere: (p, t) => { const lat = Math.acos(2 * p.v - 1), lon = p.u * TAU + t * 0.3; return [2.1 * Math.sin(lat) * Math.cos(lon), 1.9 * Math.cos(lat) * 0.92]; },
  wave: (p, t) => { const x = (p.u - 0.5) * 7.4, row = Math.floor(p.v * 6); return [x, Math.sin(x * 1.1 + t * 1.2 + row * 0.55) * 0.55 + (row - 2.5) * 0.3]; },
  grid: (p, t) => { const x = (Math.round(p.u * 28) / 28 - 0.5) * 7.4, y = (Math.round(p.v * 10) / 10 - 0.5) * 2.8; return [x, y + Math.sin(x * 0.9 + t * 1.3) * 0.28]; },
  helix: (p, t) => { const x = (p.u - 0.5) * 7.4, s = p.v < 0.5 ? 1 : -1; return [x, Math.sin(x * 1.3 + t * 1.4) * 0.95 * s + (p.k - 1) * 0.25]; },
  orbit: (p, t) => { const k = Math.floor(p.v * 3), a = p.u * TAU + t * (0.35 + k * 0.12), rot = k * Math.PI / 3; const ex = Math.cos(a) * 2.6, ey = Math.sin(a) * 0.62; return [ex * Math.cos(rot) - ey * Math.sin(rot), ex * Math.sin(rot) + ey * Math.cos(rot)]; }
};
class Component extends DCLogic {
  componentDidMount() { this.tries = 0; this.init(); }
  componentWillUnmount() { this.dead = true; cancelAnimationFrame(this.raf); this.ro && this.ro.disconnect(); this.io && this.io.disconnect(); }
  init() {
    const c = this.c = document.querySelector('[data-ix="ph"]');
    if (!c) { if (this.tries++ < 60) setTimeout(() => this.init(), 30); return; }
    const ctx = c.getContext('2d');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const shape = () => SHAPES[this.props.shape] || SHAPES.butterfly;
    const N = 1500, parts = [];
    for (let i = 0; i < N; i++) parts.push({ u: Math.random(), v: Math.random(), k: i % 4 === 0 ? 0.25 + Math.random() * 0.7 : 0.97 + Math.random() * 0.06, x: 0, y: 0, vx: 0, vy: 0, s: Math.random() < 0.15 ? 2.4 : 1.5 });
    let W = 0, H = 0, first = !reduce;
    const geo = () => { const n = W < 900; return { cx: W * 0.5, cy: H * 0.68, s: Math.min(W * (n ? 0.11 : 0.068), H * 0.09) }; };
    const target = (p, g, t) => { const [x, y] = shape()(p, t); return [g.cx + x * g.s, g.cy + y * g.s + Math.sin(t * 0.6) * 8]; };
    const cols = ['rgba(0,185,254,.9)', 'rgba(0,185,254,.9)', 'rgba(1,117,169,.85)', 'rgba(128,220,254,.95)'];
    const draw = (t, still) => {
      const g = geo(); ctx.clearRect(0, 0, W, H);
      const b = [[], [], [], []];
      parts.forEach((p) => {
        if (!still) { const [tx, ty] = target(p, g, t), k = t < 0.8 ? 0.0015 : 0.014; p.vx += (tx - p.x) * k; p.vy += (ty - p.y) * k; p.vx *= 0.86; p.vy *= 0.86; p.x += p.vx; p.y += p.vy; }
        b[Math.max(0, Math.min(3, Math.floor(((p.x - g.cx) / (g.s * 7.4) + 0.5) * 4)))].push(p);
      });
      b.forEach((l, i) => { ctx.fillStyle = cols[i]; ctx.beginPath(); l.forEach((p) => ctx.rect(p.x, p.y, p.s, p.s)); ctx.fill(); });
    };
    const resize = () => {
      const r = c.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
      W = r.width; H = r.height; c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const g = geo();
      if (first) { first = false; parts.forEach((p) => { p.x = Math.random() * W; p.y = H * 0.45 + Math.random() * H * 0.55; }); }
      else parts.forEach((p) => { [p.x, p.y] = target(p, g, 0); });
      draw(0, true);
    };
    this.ro = new ResizeObserver(resize); this.ro.observe(c); resize();
    if (reduce) { parts.forEach((p) => { [p.x, p.y] = target(p, geo(), 0); }); draw(0, true); return; }
    let visible = true, running = false; const t0 = performance.now();
    const loop = () => { if (running || this.dead) return; running = true; const step = (now) => { if (!visible || this.dead) { running = false; return; } draw((now - t0) / 1000, false); this.raf = requestAnimationFrame(step); }; this.raf = requestAnimationFrame(step); };
    this.io = new IntersectionObserver((es) => { visible = es[0].isIntersecting; if (visible) loop(); }); this.io.observe(c); loop();
  }
  renderVals() {
    const P = this.props;
    const facts = [[P.f1v, P.f1l], [P.f2v, P.f2l], [P.f3v, P.f3l]].filter((f) => f[0]).map(([v, l]) => ({ v, l }));
    return {
      kicker: P.kicker ?? '// InspireX', line1: P.line1 ?? '', line2: P.line2 ?? '', intro: P.intro ?? '',
      ctaLabel: P.cta ?? 'Book a call', ctaHref: P.ctaHref ?? 'Contact.dc.html',
      cta2: P.cta2 ?? '', cta2Href: P.cta2Href ?? '#', hasCta2: !!P.cta2,
      facts, hasFacts: facts.length > 0,
      showLogos: P.logos === true || P.logos === 'true',
      logos: [0, 1].flatMap((dup) => LOGOS.map(([f, alt, h, white]) => ({ src: 'assets/clients/' + f, alt: dup ? '' : alt, hide: dup ? 'true' : 'false', h, f: white ? 'brightness(0)' : 'grayscale(1)' })))
    };
  }
}
</script>
</body>
</html>
