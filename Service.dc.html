<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Service · InspireX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>body{margin:0;background:#EEF0F3;color:#121418;font-family:Geist,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:inherit;text-decoration:none}a:hover{color:#0175A9}::selection{background:#80DCFE}:focus-visible{outline:2px solid #0175A9;outline-offset:2px}@keyframes ixRise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}</style>
<script src="ix-data.js"></script>
</helmet>
<div id="top" style="min-height:100vh;background:#EEF0F3;overflow-x:hidden">
<dc-import name="IXHeader" active="services" hint-size="100%,0px"></dc-import>

<dc-import name="IXHero" kicker="{{ hk }}" line1="{{ s.title }}" line2="{{ s.tag }}" intro="{{ s.short }}" shape="{{ s.shape }}" cta="Book a call" ctaHref="Contact.dc.html" cta2="All services" cta2Href="Services.dc.html" hint-size="100%,720px"></dc-import>

<section data-screen-label="What we do" style="padding:0 clamp(8px,1.2vw,16px)">
  <div style="border-radius:32px;background:#FFFFFF;padding:clamp(44px,7vw,96px) clamp(20px,3.4vw,48px)">
    <div style="max-width:1300px;margin:0 auto;display:flex;flex-direction:column;gap:32px">
      <span style="font-family:'Geist Mono',monospace;font-size:12px;color:#5C5F64">// What we do</span>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px">
        <sc-for list="{{ does }}" as="d" hint-placeholder-count="4">
          <div style="min-height:180px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:22px;border-radius:20px;background:#EEF0F3"><span style="font-family:'Geist Mono',monospace;font-size:12px;color:#5C5F64">{{ d.n }}</span><span style="font-size:clamp(18px,1.6vw,21px);line-height:1.3;font-weight:500;letter-spacing:-.02em">{{ d.t }}</span></div>
        </sc-for>
      </div>
    </div>
  </div>
</section>

<div style="height:clamp(56px,8vw,104px)"></div>
<dc-import name="IXProcess" hint-size="100%,560px"></dc-import>
<section data-screen-label="Proof" style="max-width:1360px;margin:0 auto;padding:clamp(64px,9vw,120px) clamp(20px,3.4vw,48px);display:flex;flex-direction:column;gap:32px">
  <div style="display:flex;flex-direction:column;gap:14px"><span style="font-family:'Geist Mono',monospace;font-size:12px;color:#5C5F64">// Results</span><h2 style="margin:0;font-size:clamp(32px,4vw,56px);line-height:1;font-weight:500;letter-spacing:-.05em">Growth you <span style="color:#757575">can measure.</span></h2></div>
  <div style="display:flex;flex-wrap:wrap;gap:12px">
    <sc-for list="{{ proof }}" as="r" hint-placeholder-count="2">
      <div style="flex:1 1 280px;min-width:0;min-height:clamp(240px,26vw,300px);display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:24px;border-radius:22px;background:{{ r.bg }};color:{{ r.fg }}">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><span style="font-family:'Geist Mono',monospace;font-size:12px;white-space:nowrap;color:{{ r.mute }}">// {{ r.ind }}</span><span style="padding:6px 12px;border-radius:999px;background:{{ r.chip }};font-size:13px;font-weight:500">{{ r.client }}</span></div>
        <div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:clamp(52px,5vw,76px);line-height:1;font-weight:500;letter-spacing:-.06em;color:{{ r.num }}">{{ r.metric }}</span><span style="font-size:15px;font-weight:500">{{ r.label }}</span><span style="font-size:13px;line-height:1.5;color:{{ r.mute }}">{{ r.desc }}</span></div>
      </div>
    </sc-for>
  </div>
  <div style="display:flex;flex-direction:column;gap:14px;padding-top:24px">
    <span style="font-family:'Geist Mono',monospace;font-size:12px;color:#5C5F64">// Other services</span>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <sc-for list="{{ others }}" as="o" hint-placeholder-count="4"><a href="{{ o.href }}" style="display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;background:#00B9FE;color:#02061E;font-size:15px;font-weight:500" style-hover="background:#DBF5FF;color:#0175A9">{{ o.title }} →</a></sc-for>
    </div>
  </div>
</section>

<dc-import name="IXQuotes" hint-size="100%,520px"></dc-import>
<dc-import name="IXCta" hint-size="100%,380px"></dc-import>
<dc-import name="IXFooter" hint-size="100%,560px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;service&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;agentic-ai&quot;,&quot;data-analytics&quot;,&quot;business-model-innovation&quot;,&quot;creative-content-production&quot;,&quot;digital-strategy&quot;],&quot;default&quot;:&quot;agentic-ai&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { ix: 0 };
  componentDidMount() { const t = () => { if (window.IX) this.setState({ ix: 1 }); else this.tm = setTimeout(t, 30); }; t(); }
  componentWillUnmount() { clearTimeout(this.tm); }
  renderVals() {
    const D = window.IX;
    if (!D) return {};
    const slug = D.param('s') || this.props.service || 'agentic-ai';
    const idx = Math.max(0, D.services.findIndex((x) => x.slug === slug));
    const s = D.services[idx];
    if (typeof document !== 'undefined') document.title = s.title + ' · InspireX';
    return {
      s: { ...s, num: '00' + (idx + 1) }, hk: '// Services / 00' + (idx + 1),
      does: s.does.map((t, i) => ({ t, n: '0' + (i + 1) })),
      proof: s.proof.map((c) => D.results.find((r) => r.client === c)).filter(Boolean).map((r) => D.card(r)),
      others: D.services.filter((x) => x.slug !== s.slug).map((x) => ({ title: x.title, href: D.serviceHref(x.slug) }))
    };
  }
}
</script>
</body>
</html>
