<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section data-screen-label="Client stories" style="max-width:1360px;margin:0 auto;padding:clamp(64px,9vw,120px) clamp(20px,3.4vw,48px)">
  <div style="display:flex;flex-wrap:wrap;gap:40px 64px">
    <div style="flex:1 1 320px;display:flex;flex-direction:column;gap:14px">
      <span style="font-family:'Geist Mono',monospace;font-size:12px;color:#5C5F64">// What leaders say</span>
      <h2 style="margin:0;font-size:clamp(34px,4.8vw,68px);line-height:1;font-weight:500;letter-spacing:-.055em">In our<br><span style="color:#757575">clients' words.</span></h2>
    </div>
    <figure style="flex:1.4 1 420px;min-width:0;margin:0;min-height:360px;display:flex;flex-direction:column;justify-content:space-between;gap:32px;padding:clamp(24px,3vw,40px);border-radius:26px;background:#FFFFFF">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><span style="font-family:'Geist Mono',monospace;font-size:12px;color:#5C5F64">{{ q.idx }} / 03</span><span style="font-size:48px;line-height:.6;color:#0175A9">“</span></div>
      <blockquote style="margin:0;font-size:clamp(21px,2.1vw,28px);line-height:1.3;font-weight:500;letter-spacing:-.03em;text-wrap:pretty">{{ q.text }}</blockquote>
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px">
        <figcaption style="display:flex;align-items:center;gap:12px"><span style="width:46px;height:46px;flex:none;border-radius:12px;background:#02061E;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600">{{ q.init }}</span><span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:600">{{ q.name }}</span><span style="font-size:13px;color:#5C5F64">{{ q.role }}</span></span></figcaption>
        <div style="display:flex;gap:8px">
          <button onClick="{{ prev }}" aria-label="Previous testimonial" style="width:46px;height:46px;border-radius:12px;border:1px solid rgba(18,20,24,.15);background:transparent;color:#121418;font-size:18px;cursor:pointer" style-hover="background:#EEF0F3">←</button>
          <button onClick="{{ next }}" aria-label="Next testimonial" style="width:46px;height:46px;border-radius:12px;border:0;background:#0175A9;color:#FFFFFF;font-size:18px;cursor:pointer" style-hover="background:#0175A9">→</button>
        </div>
      </div>
    </figure>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
const QUOTES = [
  ['InspireX transformed our digital presence completely. Their strategic approach delivered results beyond our expectations.', 'Vardan Aslibekyan', 'CEO, Pay&Go', 'VA'],
  ['Working with InspireX was a game-changer. They understood our challenges and delivered solutions that drove real growth.', 'Dhanuka Sasanga', 'Head of Marketing, DSI Tyres', 'DS'],
  ["InspireX's strategy and dedication to excellence made our enrolment process optimisation journey seamless and impactful.", 'Dr. Chamila Ariyananda', 'CEO, UCL', 'CA']
];
class Component extends DCLogic {
  state = { q: 0 };
  renderVals() {
    const { q } = this.state, Q = QUOTES[q], n = QUOTES.length;
    return {
      q: { text: Q[0], name: Q[1], role: Q[2], init: Q[3], idx: '0' + (q + 1) },
      prev: () => this.setState({ q: (q + n - 1) % n }), next: () => this.setState({ q: (q + 1) % n })
    };
  }
}
</script>
</body>
</html>
