<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<x-dc>
<helmet>
<title>Mortgage GPT · InspireX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>body{margin:0;background:#EEF0F3;color:#121418;font-family:Geist,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:inherit;text-decoration:none}a:hover{color:#0175A9}::selection{background:#80DCFE}:focus-visible{outline:2px solid #0175A9;outline-offset:2px}@keyframes ixRise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}</style>
</helmet>
<div id="top" style="min-height:100vh;background:#EEF0F3;overflow-x:hidden">
<dc-import name="IXHeader" active="products" hint-size="100%,0px"></dc-import>

<dc-import name="IXHero" kicker="// Products / Mortgage GPT" line1="Mortgage GPT." line2="AI for mortgage enquiries." intro="An AI assistant for mortgage enquiries." shape="helix" cta="Book a demo" ctaHref="Contact.dc.html" cta2="All products" cta2Href="Products.dc.html" hint-size="100%,720px"></dc-import>

<section data-screen-label="Product screen" style="max-width:1360px;margin:0 auto;padding:0 clamp(20px,3.4vw,48px) clamp(56px,8vw,104px)">
  <div style="aspect-ratio:16/8;min-height:280px;border-radius:28px;overflow:hidden;background:#02061E">
    <x-import component-from-global-scope="image-slot" from="./image-slot.js" id="mortgage-gpt-screen" placeholder="Mortgage GPT product screenshot" shape="rect" hint-size="100%,100%"></x-import>
  </div>
</section>

<section data-screen-label="Built by" style="max-width:1360px;margin:0 auto;padding:0 clamp(20px,3.4vw,48px)">
  <a href="Service.dc.html?s=agentic-ai" style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px;padding:clamp(22px,3vw,32px);border-radius:24px;background:linear-gradient(160deg,#0175A9 0%,#01517C 100%);color:#FFFFFF" style-hover="color:#FFFFFF">
    <div style="display:flex;flex-direction:column;gap:8px;max-width:640px"><span style="font-family:'Geist Mono',monospace;font-size:12px;color:rgba(255,255,255,.85)">// Built by our Agentic AI team</span><span style="font-size:clamp(22px,2.4vw,30px);line-height:1.15;font-weight:500;letter-spacing:-.03em">Need an AI assistant for your own business? Our Agentic AI service builds them.</span></div>
    <span style="display:inline-flex;align-items:center;min-height:48px;padding:0 20px;border-radius:14px;background:#FFFFFF;color:#0175A9;font-size:14px;font-weight:600;white-space:nowrap">Agentic AI →</span>
  </a>
</section>
<div style="height:clamp(56px,8vw,104px)"></div>
<dc-import name="IXCta" hint-size="100%,380px"></dc-import>
<dc-import name="IXFooter" hint-size="100%,560px"></dc-import>
</div>
</x-dc>
