<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section data-screen-label="Process" style="padding:0 clamp(8px,1.2vw,16px)">
  <div style="position:relative;overflow:hidden;border-radius:32px;background:#02061E;color:#FFFFFF;padding:clamp(48px,8vw,112px) clamp(20px,3.4vw,48px)">
    <div style="position:absolute;left:-200px;bottom:-260px;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle,rgba(0,185,254,.42),rgba(2,6,30,0) 65%);pointer-events:none"></div>
    <div style="position:relative;max-width:1300px;margin:0 auto;display:flex;flex-direction:column;gap:40px">
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px">
        <div style="display:flex;flex-direction:column;gap:14px">
          <span style="font-family:'Geist Mono',monospace;font-size:12px;color:#00B9FE">{{ kicker }}</span>
          <h2 style="margin:0;font-size:clamp(34px,4.8vw,68px);line-height:1;font-weight:500;letter-spacing:-.055em">The Butterfly<br><span style="color:#9AA0A8">Effect Model.</span></h2>
        </div>
        <p style="margin:0;max-width:360px;font-size:15px;line-height:1.6;color:rgba(255,255,255,.75)">Small, well-aimed moves that compound into big results. Four stages, each with a clear output.</p>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:12px">
        <sc-for list="{{ steps }}" as="s" hint-placeholder-count="4">
          <button onClick="{{ s.pick }}" onMouseEnter="{{ s.pick }}" style="flex:{{ s.flex }} 1 220px;min-height:clamp(220px,30vw,320px);display:flex;flex-direction:column;justify-content:space-between;gap:28px;padding:24px;border-radius:22px;border:1px solid {{ s.border }};background:{{ s.bg }};color:#FFFFFF;font:inherit;text-align:left;cursor:pointer;transition:flex .6s cubic-bezier(.2,.8,.2,1),background .3s">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%"><span style="font-family:'Geist Mono',monospace;font-size:12px;color:rgba(255,255,255,.7)">// {{ s.num }}</span><span style="padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.1);font-size:12px">{{ s.stage }}</span></div>
            <div style="display:flex;flex-direction:column;gap:12px">
              <span style="font-size:clamp(22px,2.2vw,30px);line-height:1.05;font-weight:500;letter-spacing:-.04em">{{ s.title }}</span>
              <sc-if value="{{ s.active }}" hint-placeholder-val="{{ true }}"><span style="max-width:380px;font-size:15px;line-height:1.6;color:rgba(255,255,255,.85)">{{ s.desc }}</span></sc-if>
            </div>
          </button>
        </sc-for>
      </div>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;kicker&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;// How we work&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const STEPS = [
  ['Egg', 'Insight & diagnosis', 'We audit your market, customers and data to find where growth is hiding.'],
  ['Caterpillar', 'Foundation', 'We build the strategy, brand and data foundations everything else depends on.'],
  ['Chrysalis', 'Transformation', 'We launch the systems, AI and campaigns that change how you win customers.'],
  ['Butterfly', 'Scale & impact', 'We optimise against your KPIs and scale what works.']
];
class Component extends DCLogic {
  state = { step: 0 };
  renderVals() {
    const { step } = this.state;
    return {
      kicker: this.props.kicker ?? '// How we work',
      steps: STEPS.map(([stage, title, desc], i) => ({
        stage, title, desc, num: '0' + (i + 1), active: step === i, flex: step === i ? 2.2 : 1,
        bg: step === i ? 'linear-gradient(160deg,#0175A9 0%,#01517C 100%)' : 'rgba(255,255,255,.04)',
        border: step === i ? 'transparent' : 'rgba(255,255,255,.12)', pick: () => this.setState({ step: i })
      }))
    };
  }
}
</script>
</body>
</html>
